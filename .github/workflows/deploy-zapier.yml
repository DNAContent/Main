name: Deploy Zapier Integration

on:
  push:
    branches:
      - claude/new-integration-yM9fG
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Zapier app
        run: npx zapier-platform-cli validate

      - name: Deploy to Zapier
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: |
          echo "$ZAPIER_DEPLOY_KEY" | npx zapier-platform-cli login --non-interactive
          npx zapier-platform-cli push
